name: Base setup for gradle and java
description: Checkout, Pull Jdk 17, Setup Gradle

inputs:
  java-version:
    description: "The Java version to use"
    required: false
    default: "17"

  java-distribution:
    description: "The Java distribution to use"
    required: false
    default: "temurin"

  runner-label:
    description: "The label used to select the runner"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up QEMU
      if: runner.os == 'Linux'
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      if: runner.os == 'Linux'
      uses: docker/setup-buildx-action@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: "${{ inputs.java-version }}"
        distribution: "${{ inputs.java-distribution }}"

    - name: Download semver cli
      if: runner.os != 'Windows'
      shell: bash
      env:
        RUNNER_OS: ${{ runner.os }}
      run: |
        url=https://raw.githubusercontent.com/fsaintjacques/semver-tool/master/src/semver
        if [ "$RUNNER_OS" = Linux ]; then
          semver=/usr/local/bin/semver
        else
          semver="$HOME/.local/bin/semver"
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        fi
        if [ ! -f "$semver" ]; then
          wget -O "$semver" "$url"
        fi
        chmod +x "$semver"

    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Setup git
      run: |
        git config --local user.email "github-service-account@specmatic.io"
        git config --local user.name "Specmatic GitHub Service Account"
      shell: bash

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        # caches consume too much network bandwidth, so we disable it for our own runners.
        # moreover, everything is local, and the environment is not wiped between builds, so external caching mechanism is not required
        cache-disabled: ${{ inputs.runner-label == 'self-hosted-mac' }}

    - name: Configure temporary Docker credentials
      if: inputs.runner-label == 'self-hosted-mac'
      shell: bash
      run: |
        umask 077
        docker_config="$RUNNER_TEMP/docker-config"
        mkdir -p "$docker_config"
        printf '{"auths":{}}\n' > "$docker_config/config.json"
        echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"

