name: Base setup for gradle and java
description: Checkout, Pull Jdk 17, Setup Gradle

inputs:
  java-version:
    description: "The Java version to use"
    required: false
    default: "17"

  java-distribution:
    description: "The Java distribution to use"
    required: false
    default: "temurin"

runs:
  using: "composite"
  steps:
    - name: Set up QEMU
      if: runner.os == 'Linux'
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      if: runner.os == 'Linux'
      uses: docker/setup-buildx-action@v4

    - name: Setup git
      run: |
        git config --global user.email "github-service-account@specmatic.io"
        git config --global user.name "Specmatic GitHub Service Account"
      shell: bash

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: "${{ inputs.java-version }}"
        distribution: "${{ inputs.java-distribution }}"

    - name: Download semver cli
      if: runner.os != 'Windows'
      shell: bash
      run: |
        wget -O /usr/local/bin/semver https://raw.githubusercontent.com/fsaintjacques/semver-tool/master/src/semver
        chmod +x /usr/local/bin/semver

    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Cache trivy/grype executables
      if: runner.os == 'Linux'
      uses: actions/cache@v5
      with:
        path: |
          ~/.specmatic-trivy
          ~/.specmatic-grype
        key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-scanner-executables-v1-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-scanner-executables-v1-

    - name: Cache trivy/grype databases
      if: runner.os == 'Linux'
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/trivy
          ~/.cache/grype
        key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-scanner-databases-v1-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-scanner-databases-v1-
