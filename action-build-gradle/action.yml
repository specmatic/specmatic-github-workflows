name: Java Build with Gradle
description: Checkout, Pull Jdk 17, Setup Gradle, Test and Assemble, Submit Dependency Graph

inputs:
  gradle-extra-args:
    description: "Extra arguments to pass to the gradle command"
    required: false
    default: ""

  java-version:
    description: "The Java version to use"
    required: false
    default: "17"

  java-distribution:
    description: "The Java distribution to use"
    required: false
    default: "temurin"

  runner-label:
    description: "The label used to select the runner"
    required: false
    default: ""

  github-token-for-pr-comment:
    description: "GitHub token for posting comments on pull requests"
    required: false

  reportgenerator-extra-reports:
    description: "Additional report files to include in ReportGenerator (semicolon-separated)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - uses: specmatic/specmatic-github-workflows/action-base-setup@main
      with:
        java-version: ${{ inputs.java-version }}
        java-distribution: ${{ inputs.java-distribution }}
        runner-label: ${{ inputs.runner-label }}

    - name: ${{ inputs.runner-label == 'self-hosted-mac' && github.ref == 'refs/heads/main' && 'Check' || 'Test' }}
      shell: bash
      run: |
        ./gradlew --no-daemon ${{ inputs.runner-label == 'self-hosted-mac' && github.ref == 'refs/heads/main' && 'check' || 'test' }} ${{ inputs.gradle-extra-args }}

    - name: Setup .NET Core # Required to execute ReportGenerator
      if: ${{ inputs.runner-label == 'self-hosted-mac' }}
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.x
        dotnet-quality: 'ga'

    - name: ReportGenerator
      if: ${{ github.event_name == 'pull_request' && inputs.runner-label == 'self-hosted-mac' && inputs.github-token-for-pr-comment != '' }}
      uses: danielpalme/ReportGenerator-GitHub-Action@v5
      with:
        reports: build/reports/jacoco/*/*.xml;**/build/reports/jacoco/*/*.xml;build/reports/kover/*.xml;**/build/reports/kover/*.xml${{ inputs.reportgenerator-extra-reports != '' && format(';{0}', inputs.reportgenerator-extra-reports) || '' }}
        targetdir: coveragereport
        reporttypes: Html;MarkdownSummaryGithub;MarkdownAssembliesSummary

    - name: Add coverage to build summary
      if: ${{ inputs.runner-label == 'self-hosted-mac' }}
      shell: bash
      run: cat coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

    - name: Add coverage comment to PR (self-hosted-mac only)
      if: ${{ github.event_name == 'pull_request' && inputs.runner-label == 'self-hosted-mac' && inputs.github-token-for-pr-comment != '' }}
      run: gh pr comment $PR_NUMBER --edit-last --create-if-none --body-file coveragereport/Summary.md || true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token-for-pr-comment }}
        PR_NUMBER: ${{ github.event.number }}

    - name: Generate and submit dependency graph
      if: ${{ inputs.runner-label == 'self-hosted-mac' && github.event_name != 'pull_request' }}
      uses: gradle/actions/dependency-submission@v6
      with:
        # Reuse the same repository credentials/Gradle properties used by
        # the build when resolving the dependency graph.
        additional-arguments: ${{ inputs.gradle-extra-args }}
        dependency-graph-continue-on-failure: false

    - name: 'Upload Gradle Artifact'
      uses: actions/upload-artifact@v7
      with:
        name: Gradle Build Artifacts (${{ runner.os }})
        path: |
          build/reports
          */build/reports
          build/jacoco
          */build/jacoco
        retention-days: 5

    - name: Upload PrioSpot treemap
      uses: actions/upload-artifact@v7
      with:
        name: priospot-interactive-treemap-${{ matrix.os }}
        path: build/reports/priospot/priospot-interactive-treemap.svg
        if-no-files-found: ignore
        retention-days: 5
